<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Catálogo</title>
<link rel="manifest" href="app.webmanifest">
<meta name="theme-color" content="#1f6f5c">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f4f3ee;--panel:#fff;--panel2:#faf9f6;--ink:#1d2421;--muted:#6a716d;--line:#e2e0d8;
  --accent:#1f6f5c;--accent-ink:#fff;--soft:#e6f0ec;--danger:#b4442f;
  --r:12px;--shadow:0 1px 2px rgba(0,0,0,.05),0 6px 18px rgba(0,0,0,.06);
  color-scheme:light;
}
html[data-theme=dark]{
  --bg:#121614;--panel:#1b211e;--panel2:#171c1a;--ink:#e6ebe8;--muted:#9aa39e;--line:#2c3430;
  --accent:#52b69c;--accent-ink:#08120f;--soft:#20322c;--danger:#e2775f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  html[data-theme=auto]{
    --bg:#121614;--panel:#1b211e;--panel2:#171c1a;--ink:#e6ebe8;--muted:#9aa39e;--line:#2c3430;
    --accent:#52b69c;--accent-ink:#08120f;--soft:#20322c;--danger:#e2775f;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.muted{color:var(--muted)} .small{font-size:13px} .xs{font-size:12px}
.spacer{flex:1}
.row{display:flex;align-items:center;flex-wrap:wrap}
.gap{gap:8px}

/* Cabecera */
.top{position:sticky;top:0;z-index:20;display:flex;gap:8px;align-items:center;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.cat-btn{display:flex;align-items:center;gap:6px;border:0;background:none;font-weight:700;font-size:17px;padding:6px 8px;border-radius:10px;max-width:38vw;white-space:nowrap}
.cat-btn span{overflow:hidden;text-overflow:ellipsis}
.cat-btn:hover{background:var(--soft)}
.search{flex:1;min-width:0}
.search input{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:9px 14px;outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.danger-t{color:var(--danger)}
.icon-btn{border:0;background:none;width:38px;height:38px;border-radius:10px;display:inline-grid;place-items:center;font-size:18px;position:relative;flex:none}
.icon-btn.sm{width:30px;height:30px;font-size:15px}
.icon-btn:hover{background:var(--soft)}
.icon-btn:disabled{opacity:.3;cursor:default}
.badge{position:absolute;top:2px;right:0;background:var(--accent);color:var(--accent-ink);font-size:10px;font-weight:700;border-radius:999px;min-width:16px;height:16px;display:none;place-items:center;padding:0 4px}
.badge.on{display:grid}
.link,.lnk{border:0;background:none;color:var(--accent);padding:0;text-decoration:underline;font-size:13px}
.x{border:0;background:none;color:var(--muted);font-size:13px;padding:2px 6px;border-radius:6px}
.x:hover{color:var(--danger);background:color-mix(in srgb,var(--danger) 10%,transparent)}

/* Distribución */
.layout{display:grid;grid-template-columns:300px 1fr;min-height:calc(100vh - 60px)}
.side{border-right:1px solid var(--line);padding:12px 14px 40px;overflow:auto;max-height:calc(100vh - 60px);position:sticky;top:60px}
main{padding:12px 16px 90px;min-width:0}
.scrim{display:none}
.only-mobile{display:none}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  .side{position:fixed;z-index:40;top:0;bottom:0;left:0;width:min(340px,88vw);max-height:none;background:var(--bg);transform:translateX(-102%);transition:transform .22s;box-shadow:var(--shadow);padding-top:max(12px,env(safe-area-inset-top))}
  body.drawer .side{transform:none}
  body.drawer .scrim{display:block;position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.35)}
  .only-mobile{display:inline-grid}
  .hide-sm{display:none}
  .cat-btn{font-size:15px;max-width:34vw}
  main{padding:10px 10px 90px}
}

/* Panel de filtros */
.side-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.side-head b{font-size:16px}
.sec{border-top:1px solid var(--line);padding:10px 0}
.sec-t{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:7px}
.sec-t.click{cursor:pointer;user-select:none}
.sec-t .arrow{margin-left:auto;font-size:11px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{--c:var(--accent);border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 10px;font-size:13px;display:inline-flex;gap:6px;align-items:center;line-height:1.1}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.chip .cnt{font-size:11px;opacity:.65;font-variant-numeric:tabular-nums}
.chip:hover{border-color:var(--c)}
.chip.inc{background:var(--c);border-color:var(--c);color:#fff}
.chip.inc .dot{background:#fff}
.chip.exc{border-color:var(--danger);color:var(--danger);background:color-mix(in srgb,var(--danger) 8%,var(--panel));text-decoration:line-through}
.chip.exc .dot{background:var(--danger)}
.chip.zero{opacity:.45}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:6px 10px;font-size:13px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.seg.xs button{padding:4px 8px;font-size:12px}
.mode{margin-top:7px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.expr{font-size:13px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px;line-height:1.7}
.expr.off{opacity:.5;text-decoration:line-through}
.op{color:var(--accent);font-weight:800;font-size:12px;padding:0 2px}
.op.not{color:var(--danger)}
.ct{background:var(--soft);border-radius:6px;padding:1px 6px;white-space:nowrap}
.expr .ct,.achip .ct,.livecount .ct{white-space:normal;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.note{margin-top:7px;font-size:12px;color:var(--muted)}
.fbtn svg{width:20px;height:20px}
.view-row{display:flex;align-items:center;gap:2px}
.view{flex:1;text-align:left;border:0;background:none;padding:6px 8px;border-radius:8px;font-size:14px}
.view:hover{background:var(--soft)}
.view.on{background:var(--soft);font-weight:700;color:var(--accent)}
.help{margin-top:12px;line-height:1.5}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.switch input{appearance:none;width:34px;height:20px;border-radius:999px;background:var(--line);position:relative;margin:0;cursor:pointer;transition:.15s}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{left:16px}

/* Barra de resultados */
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.count{font-size:14px;color:var(--muted)} .count b{color:var(--ink);font-size:18px}
.sel{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 8px;font-size:13px;max-width:170px}
.active{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.achip{display:inline-flex;align-items:center;gap:4px;background:var(--soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:999px;padding:3px 4px 3px 10px;font-size:13px;max-width:100%}
.achip.exc{background:color-mix(in srgb,var(--danger) 10%,var(--panel));border-color:color-mix(in srgb,var(--danger) 35%,transparent)}
.achip.off{opacity:.5}
.achip .lnk{text-decoration:none;color:inherit;text-align:left;font-size:13px;overflow:hidden}
.achip b{color:var(--accent)} .achip.exc b{color:var(--danger)}
.joinnote{font-size:12px;color:var(--muted);align-self:center}

/* Fichas */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:transform .12s,box-shadow .12s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.thumb{aspect-ratio:4/3;background:var(--panel2);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.cb{padding:10px 12px 12px}
.cb h3{margin:0 0 6px;font-size:15.5px;line-height:1.25}
.meta{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;font-size:12.5px}
.tag{--c:var(--accent);display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 8px;font-size:12px;background:color-mix(in srgb,var(--c) 15%,transparent);color:color-mix(in srgb,var(--c) 70%,var(--ink));border:0;line-height:1.35}
.tag.solid{background:var(--c);color:#fff}
button.tag{cursor:pointer}
.kv{color:var(--muted)} .kv b{color:var(--ink);font-weight:600}
.stars{color:#e0a31a;letter-spacing:1px;font-size:13px}
.stars .off{color:var(--line)}
.list{display:flex;flex-direction:column;gap:6px}
.lrow{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer}
.lrow:hover{border-color:var(--accent)}
.lrow img{width:44px;height:44px;border-radius:8px;object-fit:cover;flex:none}
.lrow .lt{font-weight:600;min-width:0}
.lrow .meta{flex:1;justify-content:flex-end}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.tbl{border-collapse:collapse;width:100%;font-size:13.5px}
.tbl th{position:sticky;top:0;background:var(--panel2);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;font-weight:600}
.tbl td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:hover td{background:var(--soft);cursor:pointer}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty .big{font-size:44px}
.more{display:block;margin:16px auto}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);font-size:28px;box-shadow:var(--shadow);display:none;z-index:15}
@media (max-width:860px){.fab{display:block}.top .btn.primary{display:none}}

/* Ventanas */
.modal-bg{position:fixed;inset:0;z-index:60;background:rgba(10,14,12,.45);display:grid;place-items:center;padding:16px;animation:fade .15s}
.modal-bg.dlg{z-index:80}
.modal{background:var(--bg);border-radius:16px;width:min(580px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:16px 18px 18px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.wide{width:min(900px,100%)}
.modal.sm{width:min(420px,100%)}
.modal h2{margin:0;font-size:19px}
.modal h3{margin:0 0 10px;font-size:17px}
.modal h4{margin:18px 0 8px;font-size:14px}
.mhead{display:flex;align-items:center;gap:8px;margin-bottom:12px;position:sticky;top:-16px;background:var(--bg);padding:6px 0;z-index:2}
.mhead h2{flex:1}
.mfoot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px;position:sticky;bottom:-18px;background:var(--bg);padding:10px 0 2px}
.dmsg{margin:0 0 10px;line-height:1.5}
@keyframes fade{from{opacity:0}}
@media (max-width:600px){
  .modal-bg{padding:0;align-items:end}
  .modal{border-radius:18px 18px 0 0;max-height:94vh;width:100%;padding-bottom:max(18px,env(safe-area-inset-bottom))}
  .modal.sm{border-radius:18px;margin:16px;width:calc(100% - 32px);align-self:center}
}
.inp{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 10px;outline:none}
.inp:focus{border-color:var(--accent)}
.inp.sm{padding:5px 8px;font-size:13px}
textarea.inp{resize:vertical}
.lbl{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:12px 0 5px}
.fld{margin-bottom:4px}
.newopt{display:flex;gap:6px;margin-top:6px;max-width:300px}
.starsin button{border:0;background:none;font-size:26px;color:var(--line);padding:0 2px}
.starsin button.on{color:#e0a31a}
.imgbox{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.imgbox img{width:110px;height:110px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.imgbox .col{flex:1;min-width:200px;display:flex;flex-direction:column;gap:6px}
.dimg{width:100%;max-height:340px;object-fit:contain;border-radius:12px;background:var(--panel2);margin-bottom:8px}
.dtitle{font-size:22px!important;margin:4px 0 10px!important}
.drow{display:grid;grid-template-columns:140px 1fr;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.dk{color:var(--muted);font-size:13px}
.dv{white-space:pre-wrap;word-break:break-word}
.nav{display:flex;align-items:center;gap:4px;flex:1}
.pill{background:var(--soft);color:var(--accent);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600}
.menu{display:flex;flex-direction:column;gap:6px}
.menu>button{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:11px;padding:11px 13px;font-size:15px}
.menu>button:hover{border-color:var(--accent)}
.menu small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.menu-sec{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;margin:10px 0 2px}
.cat-list{display:flex;flex-direction:column;gap:6px}
.cat-row{display:flex;align-items:center;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:4px}
.cat-row.cur{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 20%,transparent)}
.cat-pick{flex:1;display:flex;gap:10px;align-items:center;border:0;background:none;text-align:left;padding:6px}
.cat-pick small{display:block;color:var(--muted);font-size:12px}
.emo{font-size:24px}
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tpl{border:1px dashed var(--line);background:var(--panel);border-radius:11px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:3px}
.tpl:hover{border-color:var(--accent);border-style:solid}
.tpl small{color:var(--muted);font-size:12px}

/* Constructor avanzado */
.grp{border:1px solid var(--line);border-left:4px solid var(--gc,var(--accent));border-radius:10px;padding:8px;background:var(--panel)}
.grp.d1{--gc:#3b6fb6;background:var(--panel2)} .grp.d2{--gc:#8a56b8;background:var(--panel)} .grp.d3{--gc:#c28a1e;background:var(--panel2)}
.grp-h{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.grp-h .lab{font-size:12px;color:var(--muted)}
.tog{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:4px 9px;font-size:12px;font-weight:700;color:var(--muted)}
.tog.on{background:var(--danger);border-color:var(--danger);color:#fff}
.grp-b{display:flex;flex-direction:column;gap:4px}
.joiner{font-size:11px;font-weight:800;color:var(--gc,var(--accent));padding-left:10px}
.cond{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:6px}
.cond.incomplete{border-style:dashed}
.cond select,.cond input{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:5px 7px;font-size:13px;max-width:100%}
.cond input{width:110px}
.cond .chips{flex-basis:100%}
.cond .chip{padding:3px 8px;font-size:12px}
.grp-f{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.livecount{background:var(--soft);border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:14px}
.livecount b{font-size:18px;color:var(--accent)}

/* Esquema */
.sc{border:1px solid var(--line);background:var(--panel);border-radius:11px;padding:10px;margin-bottom:8px}
.sc-h{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sc-h .inp{flex:1;min-width:140px}
.sc-h select{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px;font-size:13px}
.sc-o{display:flex;gap:4px;align-items:center;margin-top:4px}
.sc-o input[type=color]{width:30px;height:30px;border:0;padding:0;background:none;border-radius:6px;flex:none}
.sc-opts{margin:8px 0 0 6px;padding-left:10px;border-left:2px solid var(--line)}
.sc-flags{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}
.bar-row{display:grid;grid-template-columns:minmax(80px,180px) 1fr 80px;gap:8px;align-items:center;font-size:13px;margin:3px 0}
.bt{background:var(--panel2);border-radius:5px;height:14px;overflow:hidden}
.bt i{display:block;height:100%;border-radius:5px}
.bn{text-align:right;font-variant-numeric:tabular-nums}
.kpis{display:flex;gap:8px;flex-wrap:wrap}
.kpis div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 12px;display:flex;flex-direction:column}
.kpis small{color:var(--muted);font-size:11px}
.io{display:grid;gap:10px}
.io .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.io .box p{margin:4px 0 10px;color:var(--muted);font-size:13px}
.io .row{gap:6px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,30px);opacity:0;pointer-events:none;background:#222a26;color:#fff;border-radius:12px;padding:10px 14px;display:flex;gap:14px;align-items:center;z-index:90;transition:.2s;font-size:14px;max-width:92vw}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast .lnk{color:#8fe3c9;font-weight:700}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;font-size:12px;background:var(--panel)}
.helpc p,.helpc li{line-height:1.55}
textarea.mono{font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.bulkt{max-height:340px}
.bulkt th{vertical-align:top}
.bulkt th .sel{max-width:200px}
.bulkt td.skip{opacity:.35;text-decoration:line-through}
.bulkt tr.dup td{opacity:.55}
.bulksum{margin-top:10px;background:var(--soft);border-radius:10px;padding:9px 12px;font-size:13.5px;line-height:1.6}
details.common{margin-top:12px;border:1px solid var(--line);border-radius:11px;padding:8px 12px;background:var(--panel)}
details.common summary{cursor:pointer;font-weight:600;font-size:14px}
</style>
</head>
<body>
<div id="app"><p style="padding:20px">Cargando…</p></div>
<button class="fab" data-act="new-item" aria-label="Añadir ficha">＋</button>
<div id="modal-root"></div>
<div id="dlg-root"></div>
<div id="toast"></div>
<script>
'use strict';
const APP_VERSION = '1.1';

/* ========== Utilidades ========== */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);

const Store = {

    }

const X = `<button class="icon-btn" data-act="close" aria-label="Cerrar">✕</button>`;

function dialog({ title, msg = '', inputs = null, buttons = [{ label: 'Cancelar', value: null, cls: 'ghost' }, { label: 'Aceptar', value: true, cls: 'primary' }] }) {
  return new Promise(res => {
    const root = $('#dlg-root');
    root.innerHTML = `<div class="modal-bg dlg"><div class="modal sm" role="dialog"><h3>${esc(title)}</h3>${msg ? `<div class="dmsg">${msg}</div>` : ''}${inputs ? inputs.map((f, i) => `${f.label ? `<label class="lbl">${esc(f.label)}</label>` : ''}<input class="inp" data-dlg="${i}" value="${esc(f.value ?? '')}" placeholder="${esc(f.placeholder || '')}">`).join('') : ''}<div class="mfoot">${buttons.map((b, i) => `<button class="btn ${b.cls || ''}" data-dlgb="${i}">${b.label}</button>`).join('')}</div></div></div>`;
    const bg = root.firstElementChild;
    const finish = b => {
      let out = b ? b.value : null;
      if (inputs && out !== null && out !== false) { out = {}; inputs.forEach((f, i) => out[f.k] = $(`[data-dlg="${i}"]`, root).value); }
      root.innerHTML = ''; root.onkeydown = null; res(out);
    };
    bg.addEventListener('click', e => { if (e.target === bg) return finish(null); const bb = e.target.closest('[data-dlgb]'); if (bb) finish(buttons[+bb.dataset.dlgb]); });
    root.onkeydown = e => { if (e.key === 'Escape') { e.stopPropagation(); finish(null); } else if (e.key === 'Enter' && inputs) { e.preventDefault(); finish(buttons[buttons.length - 1]); } };
    const first = $('[data-dlg="0"]', root); if (first) { first.focus(); first.select(); } else $('[data-dlgb]:last-child', root)?.focus();
  });
}

  const c = cat(), fd = c.fields.find(f => f.id === fid); const inp = $(`[data-newopt="${fid}"]`); const label = inp?.value.trim(); if (!label) return;
  const o = ensureOpt(fd, label);

function edSave(again) {
  const c = cat(), vals = {};
  for (const fd of c.fields) {
    let v = ED.values[fd.id];
    if (fd.type === 'number') { v = isEmpty(v) ? undefined : (typeof v === 'number' ? v : num(v)); if (isNaN(v)) v = undefined; }
    if (typeof v === 'string') v = v.trim();

  }
  const now = nowISO();

  else { it = { id: uid(), created: now, updated: now, values: vals }; c.items.push(it); }

function newCond(c) { const f = c.fields.find(f => f.type === 'select') || c.fields.find(f => f.type === 'multi') || PSEUDO._any; return { type: 'cond', field: f.id, op: (OPS[f.type] || OPS.text)[0][0], value: (f.type === 'select' || f.type === 'multi') ? [] : '', value2: '' }; }
function nodeAt(path) { let n = ui().adv; for (const i of path.split('.').filter(Boolean).map(Number)) n = n.children[i]; return n; }
function parentOf(path) { const p = path.split('.').filter(Boolean); const i = +p.pop(); return [nodeAt(p.length ? '.' + p.join('.') : ''), i]; }
function openAdv() {
  const c = cat(), u = ui();

function condHTML(k, p) {

}

async function schemaSave() {
  const c = cat();
  const removed = SC.orig.filter(o => !SC.fields.find(f => f.id === o.id));
  if (removed.length && c.items.some(it => removed.some(f => !isEmpty(it.values[f.id])))) {
    if (!await confirmDlg('¿Borrar campos con datos?', `Se borrarán los datos de: <b>${removed.map(f => esc(f.name)).join(', ')}</b>.`)) return;
  }
  for (const nf of SC.fields) if (!nf.name.trim()) nf.name = 'Campo sin nombre';
  for (const it of c.items) {
    const nv = {};
    for (const nf of SC.fields) {
      const old = SC.orig.find(o => o.id === nf.id);
      let v = it.values[nf.id]; if (isEmpty(v)) continue;
      const opty = t => t === 'select' || t === 'multi';
      if (old && old.type !== nf.type && opty(old.type) && opty(nf.type)) { const ids = (Array.isArray(v) ? v : [v]).filter(id => nf.options.some(o => o.id === id)); v = nf.type === 'multi' ? ids : ids[0]; }
      else if (old && old.type !== nf.type) v = convertValue(v, old, nf);
      else if (nf.type === 'select') v = nf.options.some(o => o.id === v) ? v : undefined;
      else if (nf.type === 'multi') { v = v.filter(id => nf.options.some(o => o.id === id)); }
      if (!isEmpty(v)) nv[nf.id] = v;
    }
    it.values = nv;
  }
  c.fields = SC.fields; c.settings = SC.settings;
  // limpiar filtros que apunten a campos u opciones que ya no existen
  const u = ui();
  for (const k of Object.keys(u.facets)) if (!c.fields.find(f => f.id === k)) delete u.facets[k];
  const fixTree = n => { if (!n) return n; if (n.type === 'group') { n.children = n.children.map(fixTree).filter(Boolean); return n; } return fieldById(c, n.field) ? n : null; };
  u.adv = fixTree(u.adv); c.views.forEach(v => v.adv = fixTree(v.adv));
  SC = null; saveNow(); closeModal(); renderShell(); toast('✔️ Campos guardados');
}

  'clear-all': () => { const u = ui(); u.search = ''; u.facets = {}; u.adv = null; $('#q').value = ''; refresh(); },
  rm: el => { const u = ui(), k = el.dataset.k, f = el.dataset.f; if (k === 'search') { u.search = ''; $('#q').value = ''; } else if (k === 'adv') u.adv = null; else if (k === 'min') delete u.facets[f].min; else if (k === 'inc') u.facets[f].inc = []; else if (k === 'exc') u.facets[f].exc = u.facets[f].exc.filter(x => x !== el.dataset.v); refresh(); },
  facet: el => {
    const u = ui(), f = el.dataset.f, v = el.dataset.v; const fc = u.facets[f] ||= { inc: [], exc: [], mode: 'OR' }; fc.inc ||= []; fc.exc ||= [];
    if (fc.inc.includes(v)) { fc.inc = fc.inc.filter(x => x !== v); fc.exc.push(v); }
    else if (fc.exc.includes(v)) fc.exc = fc.exc.filter(x => x !== v);
    else fc.inc.push(v);
    LIMIT = 150; refresh();
  },
  'facet-min': el => { const u = ui(), f = el.dataset.f, n = +el.dataset.v; const fc = u.facets[f] ||= { inc: [], exc: [] }; fc.min = fc.min === n ? 0 : n; refresh(); },
  'facet-mode': el => { const fc = ui().facets[el.dataset.f]; fc.mode = el.dataset.v; refresh(); },
  'facet-join': el => { ui().facetJoin = el.dataset.v; refresh(); },
  'clear-facet': (el, e) => { e.stopPropagation(); delete ui().facets[el.dataset.f]; refresh(); },
  collapse: (el, e) => { if (e.target.closest('.x')) return; const u = ui(); u.collapsed[el.dataset.f] = !u.collapsed[el.dataset.f]; renderSide(); persist(); },
  expand: el => { EXPANDED.add(el.dataset.f); renderSide(); },
  quick: el => { const u = ui(); u.facets[el.dataset.f] = { inc: [el.dataset.v], exc: [], mode: 'OR' }; closeModal(); refresh(); toast('Filtrando por «' + esc(el.textContent.trim().split('\n')[0]) + '»'); },
  random: () => { if (!R.items.length) return; const pool = R.items.length > 1 && DETAIL?.random ? R.items.filter(x => x.id !== DETAIL.id) : R.items; openDetail(pool[Math.floor(Math.random() * pool.length)].id, { random: true }); },
  'det-nav': el => { const i = R.items.findIndex(x => x.id === DETAIL.id) + (+el.dataset.v); if (R.items[i]) openDetail(R.items[i].id); },
  'det-edit': () => openEditor(DETAIL.id),
  'det-dup': () => { const c = cat(), it = c.items.find(x => x.id === DETAIL.id); const tf = titleField(c); const vals = clone(it.values); if (tf && vals[tf.id]) vals[tf.id] += ' (copia)'; openEditor(null, vals); },
  'det-del': async () => {
    const c = cat(), it = c.items.find(x => x.id === DETAIL.id); if (!await confirmDlg('¿Borrar ficha?', `Se borrará «${esc(titleOf(it, c))}».`)) return;
    const i = c.items.indexOf(it); c.items.splice(i, 1); closeModal(); saveNow(); refresh();
    toast('🗑 Ficha borrada', { label: 'Deshacer', fn: () => { c.items.splice(i, 0, it); saveNow(); refresh(); } });
  },
  // editor
  'ed-opt': el => { const f = el.dataset.f, v = el.dataset.v, fd = cat().fields.find(x => x.id === f); if (fd.type === 'multi') { const s = new Set(ED.values[f] || []); s.has(v) ? s.delete(v) : s.add(v); ED.values[f] = [...s]; } else ED.values[f] = ED.values[f] === v ? undefined : v; rerenderField(f); },
  'ed-star': el => { ED.values[el.dataset.f] = +el.dataset.v === +ED.values[el.dataset.f] ? 0 : +el.dataset.v; rerenderField(el.dataset.f); },
  'ed-bool': el => { const v = el.dataset.v === 'true'; ED.values[el.dataset.f] = ED.values[el.dataset.f] === v ? undefined : v; rerenderField(el.dataset.f); },
  'ed-today': el => { ED.values[el.dataset.f] = today(); rerenderField(el.dataset.f); },
  'ed-clear': el => { ED.values[el.dataset.f] = undefined; rerenderField(el.dataset.f); },
  'ed-newopt': el => edAddOption(el.dataset.f),
  'ed-save': el => edSave(el.dataset.v === 'again'),
  // avanzado
  'adv-op': el => { nodeAt(el.dataset.p).op = el.dataset.v; renderAdv(); updateAdvLive(); },
  'adv-not': el => { const n = nodeAt(el.dataset.p); n.not = !n.not; renderAdv(); updateAdvLive(); },
  'adv-add': el => { const g = nodeAt(el.dataset.p), c = cat(); g.children.push(el.dataset.v === 'group' ? { type: 'group', op: g.op === 'AND' ? 'OR' : 'AND', not: false, children: [newCond(c), newCond(c)] } : newCond(c)); renderAdv(); updateAdvLive(); },
  'adv-del': el => { const [p, i] = parentOf(el.dataset.p); p.children.splice(i, 1); renderAdv(); updateAdvLive(); },
  'adv-val': el => { const k = nodeAt(el.dataset.p), v = el.dataset.v; k.value = Array.isArray(k.value) ? k.value : []; k.value = k.value.includes(v) ? k.value.filter(x => x !== v) : [...k.value, v]; renderAdv(); updateAdvLive(); },
  'adv-clear': () => { ui().adv = { type: 'group', op: 'AND', not: false, children: [newCond(cat())] }; renderAdv(); updateAdvLive(); },
  'adv-save-view': () => A['save-view'](),
  // vistas
  'save-view': async () => {
    const c = cat(), u = ui(); const r = await dialog({ title: '📌 Guardar vista', msg: 'Se guardan la búsqueda, los filtros rápidos, el filtro avanzado y el orden.', inputs: [{ k: 'name', label: 'Nombre de la vista', placeholder: 'p. ej. Para jugar con los niños' }], buttons: [{ label: 'Cancelar', value: null, cls: 'ghost' }, { label: 'Guardar', value: true, cls: 'primary' }] });
    if (!r || !r.name.trim()) return;
    c.views.push({ id: uid(), name: r.name.trim(), search: u.search, facets: clone(cleanFacets(u.facets)), adv: clone(prune(u.adv, c)), advOn: u.advOn, facetJoin: u.facetJoin, sort: clone(u.sort) });
    refresh(); toast('📌 Vista guardada');
  },
  'apply-view': el => { const c = cat(), u = ui(), v = c.views.find(x => x.id === el.dataset.id); u.search = v.search || ''; u.facets = clone(v.facets || {}); u.adv = clone(v.adv); u.advOn = v.advOn !== false; u.facetJoin = v.facetJoin || 'AND'; if (v.sort) u.sort = clone(v.sort); $('#q').value = u.search; document.body.classList.remove('drawer'); refresh(); },
  'ren-view': async el => { const v = cat().views.find(x => x.id === el.dataset.id); const r = await dialog({ title: 'Renombrar vista', inputs: [{ k: 'name', value: v.name }] }); if (r?.name?.trim()) { v.name = r.name.trim(); refresh(); } },
  'del-view': async el => { const c = cat(), v = c.views.find(x => x.id === el.dataset.id); if (await confirmDlg('¿Borrar vista?', `«${esc(v.name)}»`)) { c.views = c.views.filter(x => x !== v); refresh(); } },
  // esquema
  'sc-add': () => { SC.fields.push({ id: uid(), name: '', type: 'text', showOnCard: true }); renderSchema(); setTimeout(() => { const ins = document.querySelectorAll('[data-in="sc-name"]'); ins[ins.length - 1]?.focus(); }, 20); },
  'sc-move': el => { const i = +el.dataset.i, j = i + (+el.dataset.v); [SC.fields[i], SC.fields[j]] = [SC.fields[j], SC.fields[i]]; renderSchema(); },
  'sc-del': el => { SC.fields.splice(+el.dataset.i, 1); renderSchema(); },
  'sc-oadd': el => scAddOpt(+el.dataset.i),
  'sc-omove': el => { const o = SC.fields[+el.dataset.i].options, j = +el.dataset.j, k = j + (+el.dataset.v); [o[j], o[k]] = [o[k], o[j]]; renderSchema(); },
  'sc-odel': el => { SC.fields[+el.dataset.i].options.splice(+el.dataset.j, 1); renderSchema(); },
  'sc-save': schemaSave,
  // catálogos
  'cat-pick': el => { S.currentId = el.dataset.id; LIMIT = 150; closeModal(); renderShell(); },
  'cat-new': el => { const c = makeCatalog(el.dataset.v); S.catalogs.push(c); S.currentId = c.id; saveNow(); closeModal(); renderShell(); if (el.dataset.v === 'vacio') openSchema(); },
  'cat-edit': async el => { const c = S.catalogs.find(x => x.id === el.dataset.id); const r = await dialog({ title: 'Renombrar catálogo', inputs: [{ k: 'name', label: 'Nombre', value: c.name }, { k: 'icon', label: 'Icono (un emoji)', value: c.icon }] }); if (!r) return; c.name = r.name.trim() || c.name; c.icon = r.icon.trim() || c.icon; saveNow(); renderShell(); openCatalogs(); },
  'cat-dup': el => { const c = clone(S.catalogs.find(x => x.id === el.dataset.id)); c.id = uid(); c.name += ' (copia)'; c.items = []; c.ui = defUI(); S.catalogs.push(c); saveNow(); openCatalogs(); toast('⧉ Estructura duplicada, sin fichas'); },
  'cat-del': async el => { const c = S.catalogs.find(x => x.id === el.dataset.id); if (!await confirmDlg('¿Borrar catálogo?', `Se borrará «${esc(c.name)}» con sus <b>${c.items.length}</b> fichas. No se puede deshacer (salvo con una copia de seguridad).`)) return; S.catalogs = S.catalogs.filter(x => x !== c); if (!S.catalogs.length) S.catalogs.push(makeCatalog('vacio')); if (S.currentId === c.id) S.currentId = S.catalogs[0].id; saveNow(); renderShell(); openCatalogs(); },
  // menú
  theme: el => { S.theme = el.dataset.v; applyTheme(); persist(); openMenu(); },
  install: async () => { if (!deferredInstall) return; deferredInstall.prompt(); await deferredInstall.userChoice; deferredInstall = null; closeModal(); },
  // E/S
  'exp-backup': () => { S.lastBackup = nowISO(); download(`catalogo-copia-${today()}.json`, JSON.stringify({ app: 'catalogo', version: APP_VERSION, exported: S.lastBackup, currentId: S.currentId, catalogs: S.catalogs }), 'application/json'); persist(); },
  'exp-cat': () => { const c = cat(); download(`${slug(c.name)}-${today()}.json`, JSON.stringify({ app: 'catalogo', version: APP_VERSION, catalog: c }), 'application/json'); },
  'exp-csv': el => { const c = cat(); download(`${slug(c.name)}-${today()}.csv`, toCSV(el.dataset.v === 'all' ? c.items : R.items, c), 'text/csv;charset=utf-8'); },
  'imp-json': importJSON,
  bulk: () => openBulk(),
  'bulk-open-file': async () => { const f = await pickFile('.csv,.tsv,.txt,text/csv,text/plain'); if (f) openBulk(await readTextFile(f)); },
  'bulk-file': async () => { const f = await pickFile('.csv,.tsv,.txt,text/csv,text/plain'); if (!f) return; BULK.text = await readTextFile(f); $('#bulk-text').value = BULK.text; bulkUpdate(); },
  'bulk-go': () => bulkGo(),
};
function scAddOpt(i) { const inp = $(`[data-scnew="${i}"]`); const l = inp?.value.trim(); if (!l) return; const f = SC.fields[i]; f.options ||= []; if (!f.options.some(o => norm(o.label) === norm(l))) f.options.push({ id: uid(), label: l, color: PALETTE[f.options.length % PALETTE.length] }); renderSchema(); $(`[data-scnew="${i}"]`)?.focus(); }

/* Entradas de texto y desplegables */
const IN = {
  'bulk-text': el => { BULK.text = el.value; clearTimeout(IN.t); IN.t = setTimeout(bulkUpdate, 150); },
  'ed-v': el => { ED.values[el.dataset.f] = el.value; },
  'adv-v': el => { nodeAt(el.dataset.p)[el.dataset.k] = el.value; el.closest('.cond')?.classList.toggle('incomplete', !condComplete(nodeAt(el.dataset.p), cat())); updateAdvLive(); },
  'sc-name': el => { SC.fields[+el.dataset.i].name = el.value; },
  'sc-olabel': el => { SC.fields[+el.dataset.i].options[+el.dataset.j].label = el.value; },
  'sc-ocolor': el => { SC.fields[+el.dataset.i].options[+el.dataset.j].color = el.value; },
};
const CH = {
  'bulk-sep': el => { BULK.sep = el.value; BULK.header = 'auto'; bulkUpdate(); },
  'bulk-head': el => { BULK.header = el.checked ? 'yes' : 'no'; bulkUpdate(); },
  'bulk-map': el => { BULK.map[+el.dataset.j] = el.value; bulkUpdate(); },
  'bulk-dup': el => { BULK.skipDup = el.checked; bulkUpdate(); },
  'adv-on': el => { ui().advOn = el.checked; refresh(); },
  'adv-field': el => { const k = nodeAt(el.dataset.p), c = cat(), fd = fieldById(c, el.value); k.field = fd.id; k.op = (OPS[fd.type] || OPS.text)[0][0]; k.value = (fd.type === 'select' || fd.type === 'multi') ? [] : ''; k.value2 = ''; renderAdv(); updateAdvLive(); },
  'adv-opsel': el => { const k = nodeAt(el.dataset.p); const wasDays = k.op === 'lastDays'; k.op = el.value; if (wasDays !== (k.op === 'lastDays')) k.value = ''; renderAdv(); updateAdvLive(); },
  'sc-type': el => { const f = SC.fields[+el.dataset.i]; f.type = el.value; if ((f.type === 'select' || f.type === 'multi') && !f.options) f.options = []; if (['longtext', 'image', 'url'].includes(f.type)) f.showOnCard = false; renderSchema(); },
  'sc-card': el => { SC.fields[+el.dataset.i].showOnCard = el.checked; },
  'sc-title': el => { SC.settings.titleField = el.value; },
  'sc-img': el => { SC.settings.imageField = el.value; },
  'ed-img': async el => { const file = el.files[0]; if (!file) return; try { ED.values[el.dataset.f] = await readImage(file); rerenderField(el.dataset.f); } catch (e) { toast('⚠️ No se pudo leer la imagen'); } },
};
function readImage(file, max = 720) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => { const img = new Image(); img.onload = () => { const s = Math.min(1, max / Math.max(img.width, img.height)); const cv = document.createElement('canvas'); cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s); const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height); g.drawImage(img, 0, 0, cv.width, cv.height); res(cv.toDataURL('image/jpeg', .82)); }; img.onerror = rej; img.src = fr.result; };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el || el.disabled) return; const fn = A[el.dataset.act]; if (fn) fn(el, e); });
document.addEventListener('input', e => { const el = e.target.closest('[data-in]'); if (el && IN[el.dataset.in]) IN[el.dataset.in](el, e); });
document.addEventListener('change', e => { const el = e.target.closest('[data-ch]'); if (el && CH[el.dataset.ch]) CH[el.dataset.ch](el, e); });
document.addEventListener('keydown', e => {
  if ($('#dlg-root').firstChild) return;
  const t = e.target, typing = t.matches?.('input,textarea,select');
  if (e.key === 'Enter' && t.dataset?.newopt) { e.preventDefault(); edAddOption(t.dataset.newopt); return; }
  if (e.key === 'Enter' && t.dataset?.scnew) { e.preventDefault(); scAddOpt(+t.dataset.scnew); return; }
  if (e.key === 'Escape') { if (MODAL) closeModal(); else document.body.classList.remove('drawer'); return; }
  if (typing) return;
  if (MODAL === 'detail' && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) { const b = $(`[data-act="det-nav"][data-v="${e.key === 'ArrowRight' ? 1 : -1}"]`); if (b && !b.disabled) b.click(); return; }
  if (MODAL) return;
  if (e.key === '/') { e.preventDefault(); $('#q')?.focus(); }
  else if (e.key === 'n' || e.key === 'N') { e.preventDefault(); openEditor(null); }
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveNow(); });
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; });

function applyTheme() { document.documentElement.dataset.theme = S.theme || 'auto'; const dark = S.theme === 'dark' || (S.theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches); $('meta[name=theme-color]').content = dark ? '#121614' : '#f4f3ee'; }

/* ========== Arranque ========== */
(async function init() {
  await Store.open();
  S = await Store.get('state');
  if (!S || !Array.isArray(S.catalogs) || !S.catalogs.length) {
    const c = makeCatalog('juegos');
    S = { version: 1, theme: 'auto', currentId: c.id, catalogs: [c] };
    await saveNow();
  }
  applyTheme();
  renderShell();
  try { navigator.storage?.persist?.(); } catch (e) { }
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => { });
})();
</script>
